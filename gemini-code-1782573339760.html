<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FORMA — Complete Full-Stack Architecture Showcase</title>
  <style>
    /* ── Design Tokens ── */
    :root {
      --ink:       #1A1814;
      --fog:       #F7F5F2;
      --chalk:     #EDEAE5;
      --iron:      #7A7570;
      --clay:      --clay-light;
      --clay-light:#B87C5A;
      --clay-dark: #96633E;
      --white:     #FFFFFF;
      --border:    #E0DDD8;
      --header-bg: rgba(247, 245, 242, 0.95);

      --font-display: 'Georgia', 'Times New Roman', serif;
      --font-body:    system-ui, -apple-system, sans-serif;
      --font-mono:    'Courier New', monospace;

      --space-sm:  0.5rem;
      --space-md:  1rem;
      --space-lg:  2rem;
      --space-xl:  4rem;
      --space-2xl: 7rem;

      --radius:    3px;
      --transition: 250ms cubic-bezier(0.4, 0, 0.2, 1);
      --max-w:     1200px;
    }

    [data-theme="dark"] {
      --ink:       #F7F5F2;
      --fog:       #12110E;
      --chalk:     #23211D;
      --iron:      #A39E98;
      --clay:      #D49673;
      --white:     #1A1814;
      --border:    #2D2A25;
      --header-bg: rgba(18, 17, 14, 0.95);
    }

    /* ── Global Architecture Resets ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background: var(--fog);
      color: var(--ink);
      line-height: 1.6;
      transition: background var(--transition), color var(--transition);
    }
    a { color: inherit; text-decoration: none; }
    ul { list-style: none; }

    .container {
      max-width: var(--max-w);
      margin-inline: auto;
      padding-inline: var(--space-md);
    }

    /* ── Core Layout Headers ── */
    .site-header {
      position: sticky; top: 0; z-index: 100; background: var(--header-bg);
      backdrop-filter: blur(8px); border-bottom: 1px solid var(--chalk);
    }
    .header-inner { display: flex; align-items: center; justify-content: space-between; height: 64px; }
    .site-logo { font-family: var(--font-display); font-size: 1.4rem; letter-spacing: 0.18em; cursor: pointer; }
    .site-logo span { color: var(--clay); }

    .primary-nav { display: flex; gap: var(--space-lg); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--iron); }
    .primary-nav a { cursor: pointer; transition: color var(--transition); }
    .primary-nav a:hover, .primary-nav a.active { color: var(--ink); font-weight: 600; }

    .nav-actions { display: flex; align-items: center; gap: var(--space-sm); }
    .btn-icon {
      background: none; border: none; cursor: pointer; padding: var(--space-sm);
      color: var(--iron); display: flex; align-items: center; gap: 6px; font-size: 0.8rem;
    }
    .btn-icon:hover { color: var(--ink); }
    .cart-badge {
      background: var(--clay); color: var(--white); border-radius: 50%;
      width: 18px; height: 18px; font-size: 0.65rem; display: flex; align-items: center; justify-content: center; font-weight: 700;
    }

    /* ── App Content Route Container ── */
    #app-view { min-height: 70vh; padding: var(--space-xl) 0; }

    /* ── View Presentation Components ── */
    .hero-view { text-align: center; max-width: 600px; margin: var(--space-2xl) auto; }
    .hero-view h1 { font-family: var(--font-display); font-size: clamp(2.5rem, 5vw, 4rem); font-weight: normal; margin-bottom: var(--space-md); }
    
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--space-lg); }
    .product-card { background: var(--white); border: 1px solid var(--chalk); border-radius: 3px; overflow: hidden; padding: var(--space-md); }
    .product-thumb { font-size: 4rem; text-align: center; background: var(--fog); padding: var(--space-lg); }
    .product-details { margin-top: var(--space-md); display: flex; justify-content: space-between; align-items: center; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; padding: 0.6rem 1.2rem;
      font-size: 0.75rem; font-weight: 600; text-transform: uppercase; border-radius: 3px; cursor: pointer; border: none; transition: all var(--transition);
    }
    .btn-primary { background: var(--ink); color: var(--white); }
    .btn-primary:hover { background: var(--clay); }

    /* ── Cart Drawer Components ── */
    .cart-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; opacity: 0; pointer-events: none; transition: opacity var(--transition); }
    .cart-overlay.open { opacity: 1; pointer-events: all; }
    .cart-drawer {
      position: fixed; top: 0; right: 0; width: 400px; max-width: 100vw; height: 100vh;
      background: var(--fog); z-index: 201; transform: translateX(100%); transition: transform 300ms ease-in-out;
      display: flex; flex-direction: column;
    }
    .cart-drawer.open { transform: translateX(0); }
    .cart-header { display: flex; justify-content: space-between; align-items: center; padding: var(--space-lg); border-bottom: 1px solid var(--chalk); }
    .cart-body { flex: 1; overflow-y: auto; padding: var(--space-lg); display: flex; flex-direction: column; gap: var(--space-md); }
    .cart-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--chalk); padding-bottom: var(--space-sm); }
    .btn-remove { background: none; border: none; color: #c0392b; cursor: pointer; font-size: 0.75rem; }

    /* ── Feedback Message Bar ── */
    .network-toast {
      position: fixed; bottom: var(--space-md); left: var(--space-md); background: #27ae60; color: white;
      padding: 0.8rem var(--space-md); border-radius: 3px; font-size: 0.85rem; z-index: 300; display: none;
    }

    /* ── Utility Classes ── */
    .hidden { display: none !important; }
    .loading-text { font-style: italic; color: var(--iron); text-align: center; width: 100%; padding: var(--space-xl); }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <div class="header-inner">
        <div class="site-logo" data-route="/">FORM<span>A</span></div>

        <nav class="primary-nav" aria-label="Main site framework links">
          <span data-route="/">Home</span>
          <span data-route="/catalog">Catalog</span>
        </nav>

        <div class="nav-actions">
          <button class="btn-icon" id="theme-toggle" aria-label="Switch UI color themes">🌓</button>
          <button class="btn-icon" id="cart-toggle" aria-label="Open sidebar shopping bag">
            💼 <span class="cart-badge" id="cart-count">0</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <main id="app-view" class="container"></main>

  <div class="cart-overlay" id="cart-overlay"></div>
  <aside class="cart-drawer" id="cart-drawer" role="dialog" aria-modal="true">
    <div class="cart-header">
      <h2>Your Space</h2>
      <button class="btn-icon" id="cart-close">✕</button>
    </div>
    <div class="cart-body" id="cart-items-hook"></div>
    <div style="padding: var(--space-lg); border-top: 1px solid var(--chalk);">
      <div style="display:flex; justify-content:space-between; margin-bottom:var(--space-md);">
        <span>Total Estimated</span>
        <strong id="cart-subtotal">$0.00</strong>
      </div>
      <button class="btn btn-primary" style="width:100%;" id="btn-checkout">Checkout Database</button>
    </div>
  </aside>

  <div class="network-toast" id="toast">Database synced successfully.</div>

  <script>
    /* ==========================================================================
       1. MOCK BACKEND DATA LAYER (REPRESENTING SERVER & SYSTEM DATABASE)
       ========================================================================== */
    const DB = {
      inventory: [
        { id: "fs-1", name: "Arc Lounge Chair", price: 680, thumb: "🪑", category: "Seating" },
        { id: "fs-2", name: "Slab Dining Table", price: 1240, thumb: "🪵", category: "Tables" },
        { id: "fs-3", name: "Column Floor Lamp", price: 395, thumb: "💡", category: "Lighting" }
      ],
      cart: []
    };

    /**
     * Self-contained Mock REST API Server
     * Intercepts calls and returns decoupled promises with simulated round-trip network delays.
     */
    const MockServerAPI = {
      delay: (ms = 300) => new Promise(res => setTimeout(res, ms)),

      async get(endpoint) {
        await this.delay(400);
        console.log(`%c[GET] Server API request targeting: ${endpoint}`, "color: #3498db; font-weight: bold;");
        
        if (endpoint === '/api/products') {
          return { status: 200, data: JSON.parse(JSON.stringify(DB.inventory)) };
        }
        if (endpoint === '/api/cart') {
          return { status: 200, data: JSON.parse(JSON.stringify(DB.cart)) };
        }
        return { status: 404, message: "Endpoint resource not resolved." };
      },

      async post(endpoint, payload) {
        await this.delay(300);
        console.log(`%c[POST] Server API update context to ${endpoint}:`, "color: #27ae60; font-weight: bold;", payload);
        
        if (endpoint === '/api/cart') {
          const item = DB.inventory.find(p => p.id === payload.productId);
          if (!item) return { status: 400, message: "Product missing structural database key alignment." };
          
          const cartItem = { ...item, serverItemId: "srv_" + Math.random().toString(36).substr(2, 5) };
          DB.cart.push(cartItem);
          return { status: 201, data: cartItem };
        }
        return { status: 404 };
      },

      async delete(endpoint) {
        await this.delay(200);
        console.log(`%c[DELETE] Server API target remove request: ${endpoint}`, "color: #e74c3c; font-weight: bold;");
        
        if (endpoint.startsWith('/api/cart/')) {
          const srvId = endpoint.split('/').pop();
          DB.cart = DB.cart.filter(item => item.serverItemId !== srvId);
          return { status: 200, success: true };
        }
        return { status: 404 };
      }
    };

    /* ==========================================================================
       2. CLIENT-SIDE ROUTER ENGINE
       ========================================================================== */
    const Router = {
      routes: {},
      viewElement: null,

      init(viewElement) {
        this.viewElement = viewElement;
        
        // Intercept relative path pointer attributes safely 
        document.body.addEventListener('click', e => {
          const routeTarget = e.target.closest('[data-route]');
          if (routeTarget) {
            e.preventDefault();
            this.navigate(routeTarget.dataset.route);
          }
        });

        // Sync route states on browser address travel
        window.addEventListener('popstate', () => this.resolve());
        this.resolve();
      },

      add(path, handlerView) {
        this.routes[path] = handlerView;
      },

      navigate(path) {
        window.history.pushState(null, null, path === '/' ? window.location.pathname : '#' + path);
        this.resolve();
      },

      async resolve() {
        // Handle client hash route mappings easily for self-contained cross-origin page systems
        let path = window.location.hash.replace('#', '') || '/';
        const view = this.routes[path] || this.routes['/'];
        
        // Highlight active navbar items
        document.querySelectorAll('[data-route]').forEach(el => {
          el.classList.toggle('active', el.dataset.route === path);
        });

        this.viewElement.innerHTML = `<div class="loading-text">Synchronizing platform data views...</div>`;
        this.viewElement.innerHTML = await view();
      }
    };

    /* ==========================================================================
       3. FRONTEND CONTROLLER & STATE VIEW INJECTIONS
       ========================================================================== */
    const AppController = {
      async init() {
        this.cacheDOM();
        this.bindGlobalEvents();
        
        // Initialize dynamic modular path listings inside the Router
        Router.add('/', async () => `
          <div class="hero-view">
            <h1>Objects for <em>deliberate</em> living.</h1>
            <p style="color: var(--iron); margin-bottom: 2rem;">A full-stack, state-driven platform proof-of-concept compiled in a monolithic workflow matrix structure.</p>
            <button class="btn btn-primary" data-route="/catalog">Explore Catalog</button>
          </div>
        `);

        Router.add('/catalog', async () => {
          const res = await MockServerAPI.get('/api/products');
          if (res.status !== 200) return `<p>Failed to query server components database variables.</p>`;

          const productsHTML = res.data.map(p => `
            <div class="product-card">
              <div class="product-thumb">${p.thumb}</div>
              <div class="product-details">
                <div>
                  <h4>${p.name}</h4>
                  <p style="color: var(--iron); font-size:0.9rem;">$${p.price}</p>
                </div>
                <button class="btn btn-primary action-add-to-cart" data-id="${p.id}">Add</button>
              </div>
            </div>
          `).join('');

          return `<div class="product-grid">${productsHTML}</div>`;
        });

        Router.init(document.getElementById('app-view'));
        await this.syncCartWithServer();
      },

      cacheDOM() {
        this.themeBtn = document.getElementById('theme-toggle');
        this.cartToggleBtn = document.getElementById('cart-toggle');
        this.cartCloseBtn = document.getElementById('cart-close');
        this.cartDrawer = document.getElementById('cart-drawer');
        this.cartOverlay = document.getElementById('cart-overlay');
        this.cartItemsHook = document.getElementById('cart-items-hook');
        this.cartCountBadge = document.getElementById('cart-count');
        this.cartSubtotalText = document.getElementById('cart-subtotal');
        this.toast = document.getElementById('toast');
        this.checkoutBtn = document.getElementById('btn-checkout');
      },

      bindGlobalEvents() {
        // Light/Dark Theme Switcher Action
        this.themeBtn.addEventListener('click', () => {
          const targetTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', targetTheme);
        });

        // Cart Visibility Modifiers
        this.cartToggleBtn.addEventListener('click', () => this.toggleDrawer(true));
        this.cartCloseBtn.addEventListener('click', () => this.toggleDrawer(false));
        this.cartOverlay.addEventListener('click', () => this.toggleDrawer(false));

        // Intercept Dynamic App View Clicks (Add to Cart events via delegation)
        document.getElementById('app-view').addEventListener('click', async (e) => {
          if (e.target.classList.contains('action-add-to-cart')) {
            const productId = e.target.dataset.id;
            e.target.disabled = true;
            e.target.textContent = "...";
            
            await MockServerAPI.post('/api/cart', { productId });
            await this.syncCartWithServer();
            this.triggerToast("Item saved to backend DB.");
            
            e.target.disabled = false;
            e.target.textContent = "Add";
            this.toggleDrawer(true);
          }
        });

        // Intercept Cart Item Removal events via delegation
        this.cartItemsHook.addEventListener('click', async (e) => {
          if (e.target.classList.contains('btn-remove')) {
            const targetId = e.target.dataset.id;
            e.target.textContent = "...";
            await MockServerAPI.delete(`/api/cart/${targetId}`);
            await this.syncCartWithServer();
            this.triggerToast("Item purged from database instance.");
          }
        });

        this.checkoutBtn.addEventListener('click', () => {
          alert("Full stack database transaction loop simulation compiled successfully.");
          this.toggleDrawer(false);
        });
      },

      toggleDrawer(show) {
        this.cartDrawer.classList.toggle('open', show);
        this.cartOverlay.classList.toggle('open', show);
      },

      async syncCartWithServer() {
        const response = await MockServerAPI.get('/api/cart');
        if (response.status === 200) {
          this.renderCartUI(response.data);
        }
      },

      renderCartUI(cartItems) {
        this.cartCountBadge.textContent = cartItems.length;

        if (cartItems.length === 0) {
          this.cartItemsHook.innerHTML = `<p style="text-align:center; color: var(--iron); font-style:italic; padding: 2rem 0;">Database stack space is empty.</p>`;
          this.cartSubtotalText.textContent = "$0.00";
          return;
        }

        this.cartItemsHook.innerHTML = cartItems.map(item => `
          <div class="cart-item">
            <div style="display:flex; align-items:center; gap: 1rem;">
              <span>${item.thumb}</span>
              <div>
                <h5 style="font-family:var(--font-display);">${item.name}</h5>
                <span style="color:var(--iron); font-size:0.85rem;">$${item.price}</span>
              </div>
            </div>
            <button class="btn-remove" data-id="${item.serverItemId}">Remove</button>
          </div>
        `).join('');

        const totalSum = cartItems.reduce((acc, curr) => acc + curr.price, 0);
        this.cartSubtotalText.textContent = `$${totalSum.toLocaleString('en-US', { minimumFractionDigits: 2 })}`;
      },

      triggerToast(msg) {
        this.toast.textContent = `✓ ${msg}`;
        this.toast.style.display = "block";
        setTimeout(() => { this.toast.style.display = "none"; }, 2500);
      }
    };

    // Initialize the Full-Stack Monolith on page load
    document.addEventListener('DOMContentLoaded', () => AppController.init());
  </script>
</body>
</html>
